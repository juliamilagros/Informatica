<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <body>
        <h1>Trivia de Conocimientos Generales</h1>
        <h2>1. ¿Que organo del cuerpo humano bombea a la sagre?</h2>
        <input type="radio" name="p1" value="a"> Pulmones<br>
        <input type="radio" name="p1" value="b"> Corazon<br>
        <input type="radio" name="p1" value="c"> Cerebro<br>
        <h2>2. ¿Cual es el pais conocido como la tierra del sol naciente?</h2>
        <input type="radio" name="p2" value="a"> China<br>
        <input type="radio" name="p2" value="b"> Japon<br>
        <input type="radio" name="p2" value="c"> Corea del sur<br>
        <h2>3. ¿Cuál es la capital de Argentina?</h2>
        <input type="radio" name="p3" value="a"> La Plata<br>
        <input type="radio" name="p3" value="b"> Cordoba<br>
        <input type="radio" name="p3" value="c"> Buenos Aires<br>
        <br>
        <button id="Chequear" type="button">Comprobar</button>
        <button id="Intentar denuevo" type="button">Reiniciar</button>
        <p id="resultado"></p>
        <script>
        document.getElementById("comprobar").addEventListener("click", function() {
        let puntaje = 0;
        let p1 = document.querySelector('input[name="p1"]:checked');
        let p2 = document.querySelector('input[name="p2"]:checked');
        let p3 = document.querySelector('input[name="p3"]:checked');
        if (!p1 || !p2 || !p3) {
        document.getElementById("resultado").innerHTML =
        "Debes responder las tres preguntas.";
        return;
        }
        // Respuestas correctas
        if (p1.value === "b") puntaje++;
        if (p2.value === "b") puntaje++;
        if (p3.value === "c") puntaje++;
        let mensaje = "<h3>Resultado: " + puntaje + "/3 puntos</h3>";
        if (puntaje === 3) {
        mensaje += "¡Felicitaciones! Respondiste excelente todas las preguntas.";
        } else if (puntaje === 2) {
        mensaje += "Te falto responder corrrectamente solo una pregunta...Se intento";
        } else {
        mensaje += "Que lastima! Intenta rehacerlo denuvo!.";
        }
        document.getElementById("resultado").innerHTML = mensaje;
        });
        document.getElementById("Intentar denuevo").addEventListener("click", function() {
        let opciones = document.querySelectorAll('input[type="radio"]');
        for (let opcion of opciones) {
        opcion.checked = false;
        }
        document.getElementById("resultado").innerHTML = "";
        });
        </script>
</body>
</html>
